<script>
document.querySelectorAll('.bk-sidebar').forEach(function (s) {
  var drop = s.querySelector('.bk-droplet'), navs = s.querySelectorAll('.bk-nav');
  navs.forEach(function (n, i) {
    n.addEventListener('click', function () {
      navs.forEach(function (x) { x.setAttribute('aria-selected', x === n ? 'true' : 'false'); });
      drop.style.transform = 'translateY(' + (i * n.offsetHeight) + 'px)';
    });
  });
});
document.querySelectorAll('.bk-sidepanel').forEach(function (p) {
  var fly = p.querySelector('.bk-sideflyout'), grp = p.querySelector('[data-group]');
  function show(on) { if (on) { fly.style.top = (grp.offsetTop - 6) + 'px'; fly.setAttribute('data-open', ''); } else fly.removeAttribute('data-open'); }
  p.querySelectorAll('.bk-sidepanel__toggle').forEach(function (b) { b.addEventListener('click', function () {
    if (p.hasAttribute('data-collapsed')) { p.removeAttribute('data-collapsed'); show(false); b.setAttribute('aria-label', 'Collapse menu'); } else { p.setAttribute('data-collapsed', ''); b.setAttribute('aria-label', 'Expand menu'); }
  }); });
  grp.addEventListener('mouseenter', function () { if (p.hasAttribute('data-collapsed')) show(true); });
  grp.addEventListener('focus', function () { if (p.hasAttribute('data-collapsed')) show(true); });
  p.addEventListener('mouseleave', function () { if (!p.dataset.keep) show(false); });
  p.querySelectorAll('.bk-sidetree .bk-sideitem, .bk-sideflyout .bk-sideitem').forEach(function (b) { b.addEventListener('click', function () {
    var label = b.textContent;
    p.querySelectorAll('.bk-sidetree .bk-sideitem, .bk-sideflyout .bk-sideitem').forEach(function (x) { if (x.textContent === label) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current'); });
  }); });
});
document.querySelectorAll('.bk-sidepanel[data-collapsed]').forEach(function (p) { p.dataset.keep = '1'; p.addEventListener('mouseenter', function () { delete p.dataset.keep; }, { once: true }); });

document.querySelectorAll('.bk-sidepanel').forEach(function (p) {
  var k = 0;
  p.querySelectorAll(':scope > .bk-sidepanel__head, :scope > .bk-sidepanel__search, :scope > .bk-sidepanel__section, :scope > .bk-sideitem, :scope > .bk-sidetree > .bk-sideitem, :scope > .bk-sidepanel__foot .bk-sideitem').forEach(function (el) {
    el.style.setProperty('--bk-i', k++);
    el.querySelectorAll('*').forEach(function (c) { c.style.setProperty('--bk-i', k - 1); });
  });
  var grp = p.querySelector('[data-group]');
  grp.addEventListener('click', function () {
    if (p.hasAttribute('data-collapsed')) return;
    grp.setAttribute('aria-expanded', grp.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
  });
});
</script>
