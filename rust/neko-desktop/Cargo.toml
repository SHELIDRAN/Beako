[package]
name = "neko-desktop"
version = "0.2.0"
edition = "2024"
description = "Neko for Windows: a MangaDex reader in Rust, styled after Apple's design language"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit", "x11", "wayland", "clipboard", "links"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
keyring = { version = "3", features = ["windows-native", "linux-native"] }
open = "5.4.5"
raw-window-handle = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
