name: 🌟 Feature request
description: Suggest something that would make Beako better
labels: [ feature ]
body:

  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: What would you like Beako to do, and why?
      placeholder: |
        Example:
          "Let me save a set of tag filters and reuse it from Browse..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Mock-ups, apps that do it well, or anything else that helps.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched the existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the **[latest Beako release](https://github.com/SHELIDRAN/Beako/releases/latest)** and checked its settings.
          required: true
