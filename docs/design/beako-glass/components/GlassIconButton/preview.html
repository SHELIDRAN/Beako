<!-- @dsCard group="Actions" height=110 subtitle="Follow rises from below; Next chapter swings on hover" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body class="bk-stage">
<div style="position:relative;height:110px;overflow:hidden">
  <div class="bk-art" style="position:absolute;inset:0;opacity:.5"></div>
  <div style="position:absolute;inset:0;display:flex;gap:12px;align-items:center;justify-content:center">
    <button class="bk-icon-button bk-glass bk-glass--control" aria-label="Search" title="Search"><svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    <button class="bk-icon-button bk-glass bk-glass--control" aria-label="Refresh" title="Refresh"><svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    <button class="bk-icon-button bk-glass bk-glass--control" aria-label="More" title="More"><svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
    <button class="bk-icon-button bk-glass bk-glass--control" aria-pressed="false" aria-label="Follow series" title="Follow series"><svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15-5-2.18L7 18V5h10v13z"/></svg></button>
    <button class="bk-icon-button bk-icon-button--swing bk-glass bk-glass--control" aria-label="Next chapter" title="Next chapter"><svg class="bk-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
  </div>
</div>
<script>
document.querySelectorAll('.bk-icon-button[aria-pressed]').forEach(function (b) {
  b.addEventListener('click', function () {
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on ? 'true' : 'false'); if (!on) b.setAttribute('data-was-on', '');
    b.setAttribute('aria-label', on ? 'Unfollow series' : 'Follow series'); b.title = b.getAttribute('aria-label');
  });
});
</script>
</body></html>
