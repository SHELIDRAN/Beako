<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ground" cx="0.18" cy="0.02" r="1.15">
      <stop offset="0" stop-color="#2a2b30"/>
      <stop offset="0.55" stop-color="#141519"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef6a40"/>
      <stop offset="1" stop-color="#c8461f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Ground: a squircle-ish rounded square with the palette's top-left glow and a glass rim. -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#ground)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- A clear glass droplet behind the letter, the selection shape of Beako Glass. -->
  <rect x="236" y="196" width="552" height="632" rx="200" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <!-- The B, in the white of Beako's text. -->
  <g filter="url(#soft)" fill="url(#ink)">
    <path d="M330 262
             h196
             c96 0 158 52 158 132
             c0 50 -26 88 -70 108
             c62 18 100 66 100 130
             c0 92 -70 150 -178 150
             h-206 z
             M430 350 v116 h86 c42 0 68 -22 68 -58 c0 -36 -26 -58 -68 -58 z
             M430 552 v122 h102 c46 0 74 -24 74 -61 c0 -37 -28 -61 -74 -61 z"
          fill-rule="evenodd"/>
  </g>
  <!-- The accent: Beako's orange unread dot. -->
  <circle cx="742" cy="282" r="62" fill="url(#accent)"/>
  <circle cx="742" cy="282" r="62" fill="none" stroke="#141519" stroke-width="16"/>
</svg>
