<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}.pane{padding:24px}.split{display:grid;grid-template-columns:1fr 1fr}.cap{margin:0 0 16px;color:var(--text-muted);font:600 11px/14px var(--font-sans);letter-spacing:.6px;text-transform:uppercase}</style></head>
<body>
<div class="split"><div class="bk-stage pane"><p class="cap">Neutral</p><div class="bk-tabs" role="tablist" aria-label="Title page"><button class="bk-tab" role="tab" aria-selected="true">Chapters</button><button class="bk-tab" role="tab" aria-selected="false">Details</button><button class="bk-tab" role="tab" aria-selected="false">Related</button><span class="bk-tabs__ind"></span></div></div><div class="bk-stage pane" data-theme="porcelain"><p class="cap">Porcelain</p><div class="bk-tabs" role="tablist" aria-label="Title page"><button class="bk-tab" role="tab" aria-selected="true">Chapters</button><button class="bk-tab" role="tab" aria-selected="false">Details</button><button class="bk-tab" role="tab" aria-selected="false">Related</button><span class="bk-tabs__ind"></span></div></div></div>
<script>
document.querySelectorAll('.bk-tabs').forEach(function (g) {
  var ind = g.querySelector('.bk-tabs__ind'), t = g.querySelectorAll('.bk-tab'), cur = null;
  function place(b) {
    var right = g.offsetWidth - b.offsetLeft - b.offsetWidth;
    if (cur !== null) { var fwd = b.offsetLeft > cur; ind.style.setProperty('--bk-delay-l', fwd ? '90ms' : '0ms'); ind.style.setProperty('--bk-delay-r', fwd ? '0ms' : '90ms'); }
    ind.style.left = b.offsetLeft + 'px'; ind.style.right = right + 'px'; cur = b.offsetLeft;
  }
  t.forEach(function (b) { if (b.getAttribute('aria-selected') === 'true') place(b);
    b.addEventListener('click', function () { t.forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); }); place(b); }); });
});
</script>
</body></html>
