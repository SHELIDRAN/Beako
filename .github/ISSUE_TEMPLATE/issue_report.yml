name: 🐞 Issue report
description: Report a problem in Beako
labels: [ bug ]
body:

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem showed up?
      placeholder: |
        Example:
          1. Open a title from Browse
          2. Choose "Reading from MangaDex" and pick another source
          3. The chapter list stays empty
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: |
        Example:
          "The chapters from the other source should be listed."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Screenshots help.
      placeholder: |
        Example:
          "The list stayed empty and the picker said '1 failed'."
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Beako log
      description: |
        Attach `beako.log` from `%APPDATA%\Beako` (paste that into the File Explorer address bar). It records source failures, images that didn't load and crashes. It never contains passwords, tokens or sign-in details.
      placeholder: |
        Drag beako.log here, or paste the lines around the problem.

  - type: input
    id: beako-version
    attributes:
      label: Beako version
      description: You can find it in **More → General → About**.
      placeholder: |
        Example: "0.1.4"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings → System → About → Windows specifications.
      placeholder: |
        Example: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source (if the problem is with reading)
      description: MangaDex, or the installed source and the repository you added it from.
      placeholder: |
        Example: "Weeb Central from the m2k3a repository"

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Anything else that might help.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched the existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the **[latest Beako release](https://github.com/SHELIDRAN/Beako/releases/latest)**.
          required: true
        - label: I understand that installed sources are third-party code, and problems on a source's own site may need its maintainer.
          required: true
